<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир Крыс</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1a1a1a; 
            color: white; 
            text-align: center; 
            padding: 20px; 
        }
        .hole-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #ffcc00;
            border: 2px dashed #555;
            padding: 10px 20px;
            border-radius: 50px;
            transition: 0.3s;
        }
        .hole-link:hover {
            background: #333;
            border-color: #ffcc00;
        }
        img { 
            max-width: 90%; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        h1 { color: #ffcc00; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 15px; display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Моя супер-крыса</h1>
        <p>Посмотри, какой солидный грызун!</p>
        <img src="rat.png" alt="Крыса">
        <style>
        <a href="/krisinaya_nora/" class="hole-link">🕳️ Юркнуть в уютную нору...</a>
    </div>
</body>
</html>
